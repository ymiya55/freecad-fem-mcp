name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  static:
    name: Bandit and pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.11.7"
      - name: Synchronize the locked environment
        run: uv sync --frozen --extra dev
      - name: Bandit (repository policy)
        run: uv run --frozen --extra dev bandit -c .bandit -r src addon scripts security -lll -iii
      - name: pip-audit dependencies (exclude editable project)
        # The project is installed editable so tests/imports use src/.  Audit
        # its resolved third-party environment separately; pip-audit cannot
        # vulnerability-score the local checkout itself.
        run: uv run --frozen --extra dev pip-audit --local --skip-editable
      - name: Repository security gate
        run: uv run --frozen python scripts/security_scan.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
