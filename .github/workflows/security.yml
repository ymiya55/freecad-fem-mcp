name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  static:
    name: Bandit and pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install audit tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Bandit (repository policy)
        run: bandit -c .bandit -r src addon scripts security -lll -iii
      - name: pip-audit dependencies (exclude editable project)
        # The project is installed editable so tests/imports use src/.  Audit
        # its resolved third-party environment separately; pip-audit cannot
        # vulnerability-score the local checkout itself.
        run: pip-audit --local --skip-editable
      - name: Repository security gate
        run: python scripts/security_scan.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
