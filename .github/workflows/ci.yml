name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.11.7"
      - name: Synchronize the locked environment
        run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - name: Run tests
        run: uv run --frozen --extra dev python -m pytest
      - name: Ruff lint
        run: uv run --frozen --extra dev ruff check .
      - name: Run dependency-free static security gate
        run: uv run --frozen python scripts/security_scan.py
