[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "freecad-fem-mcp"
version = "0.1.0"
description = "Safe MCP bridge for FreeCAD FEM SolverCalculiX workflows"
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Operating System :: Microsoft :: Windows"]
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.24,<2",
  "hypothesis>=6,<7",
  "ruff>=0.8,<1",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

[project.scripts]
freecad-fem-mcp = "freecad_fem_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_fem_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI deterministic even when a developer has an aggressive user-level
# Ruff configuration.  Security-specific checks are handled by Bandit and the
# repository scanner below.
select = ["E4", "E7", "E9", "F"]
